[tool.poetry]
name = "progphilbot"
version = "1.5.0"
description = ""
authors = ["Jedddy <jedbalita25@gmail.com>"]
readme = "README.md"
packages = [
    { include = "src" },
    { include = "bot", from = "src" },
    { include = "cogs", from = "src" },
    { include = "*", from = "src/bot" },
]

[tool.poetry.dependencies]
python = "^3.10.14"
charset-normalizer = "^3.3.2"  # <-- ADD THIS
python-dotenv = "^1.0.1"
pyyaml = "^6.0"
asyncpg = "^0.29.0"
requests = "^2.32.0"          # <-- BUMP THIS (was 2.28.2)
yoyo-migrations = "^8.2.0"
cloudscraper = "^1.2.69"
bs4 = "^0.0.2"
psycopg2-binary = "^2.9.5"
cryptography = "^46.0.5"
python-levenshtein = "^0.25.1"
setuptools = "^78.1.1"
pydantic = "^2.8.0"
python-dateutil = "^2.9.0"
discord-py = "^2.5.2"
pydantic-ai-slim = {extras = ["openai"], version = "^2.37.0"}

[tool.poetry.group.dev.dependencies]  # <-- MOVE DEV TOOLS HERE
flake8 = "^7.1.0"

[tool.poetry.scripts]
progphil = "main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"